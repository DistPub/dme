<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="DME" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        height: 100dvh;
        margin: 0;
        background: #0a0a0a;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
        background: #0a0a0a;
      }
      /* Disable iOS native long-press menus on images/videos so the app can handle them. */
      img,
      video {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
    <!-- Static pre-JS spinner for the boot screen (no React/RN runtime yet).
         Inline SVG mirrors RN-web ActivityIndicator small size (20x20):
         viewBox 0 0 32 32, track circle opacity 0.2, arc strokeDasharray 80
         strokeDashoffset 60, animation 0.75s linear infinite.
         Color matches theme.colors.accent (#007AFF). -->
    <style id="dme-boot-spinner">
      @keyframes dme-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes dme-fly {
        0%   { transform: translateX(44px); opacity: 0; }
        5.6% { opacity: 1; }
        16%  { transform: translateX(0); opacity: 1; }
        52%  { transform: translateX(0); opacity: 1; }
        68%  { transform: translateX(-44px); opacity: 0; }
        100% { transform: translateX(-44px); opacity: 0; }
      }
      .dme-slogan {
        margin-top: 20px;
        color: #8E8E93;
        font-size: 14px;
        white-space: nowrap;
      }
      .dme-slogan span {
        display: inline-block;
        animation: dme-fly 5s linear infinite;
        will-change: transform, opacity;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <!-- Static pre-JS placeholder: dark background + centered logo.
           Shown while the 7.6MB CanvasKit WASM loads (before React mounts).
           Pure inline CSS -- no external stylesheet so it paints immediately.
           registerRootComponent replaces everything inside #root on mount. -->
      <div
        id="dme-boot"
        style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a;"
      >
        <img
          src="/logo.png"
          alt="DME"
          width="96"
          height="96"
          style="width: 96px; height: 96px; display: block;"
        />
        <svg viewBox="0 0 32 32" width="20" height="20" style="margin-top:24px; animation: dme-spin 0.75s linear infinite;">
          <circle cx="16" cy="16" r="14" fill="none" stroke="#007aff" stroke-width="4" opacity="0.2"></circle>
          <circle cx="16" cy="16" r="14" fill="none" stroke="#007aff" stroke-width="4" stroke-dasharray="80" stroke-dashoffset="60" stroke-linecap="round"></circle>
        </svg>
        <div class="dme-slogan">
          <span style="animation-delay:0s">大</span><span style="animation-delay:.3s">隐</span><span style="animation-delay:.6s">隐</span><span style="animation-delay:.9s">于</span><span style="animation-delay:1.2s">世</span>
        </div>
      </div>
    </div>
      <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function (err) {
              console.error('DME: SW registration failed', err);
            });
          });
        }
      </script>
  </body>
</html>
