<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0a0a0a;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background: #0a0a0a;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <!-- Static pre-JS placeholder: dark background + centered logo.
           Shown while the 7.6MB CanvasKit WASM loads (before React mounts).
           Pure inline CSS -- no external stylesheet so it paints immediately.
           registerRootComponent replaces everything inside #root on mount. -->
      <div
        id="dme-boot"
        style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a;"
      >
        <img
          src="/logo.png"
          alt="DME"
          width="96"
          height="96"
          style="width: 96px; height: 96px; display: block;"
        />
        <div style="margin-top: 24px; color: #8e8e93; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; letter-spacing: 0.06em;">Loading…</div>
      </div>
    </div>
  </body>
</html>
